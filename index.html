    <script>
      // Restore path if redirected from static 404.html
      (function() {
        var redirect = sessionStorage.getItem('mit2fit_redirect_path');
        if (redirect) {
          sessionStorage.removeItem('mit2fit_redirect_path');
          if (redirect !== '/' && redirect !== window.location.pathname) {
            window.history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
