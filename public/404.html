<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mit2Fit - Redirecting...</title>
    <script>
      // Single Page Application static host redirect
      // Saves the requested path and query into sessionStorage and redirects to root index.html
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      sessionStorage.setItem('mit2fit_redirect_path', path + search + hash);
      window.location.replace('/');
    </script>
    <meta http-equiv="refresh" content="0;URL='/'" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #09090b;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #00E599;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="spinner"></div>
      <p style="font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; color: #a1a1aa;">Loading Mit2Fit...</p>
    </div>
  </body>
</html>
